name: Generate Docs with AI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'openapi.yaml'
  workflow_dispatch:  # allows manual trigger from Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout product repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install openai

      - name: Run doc generation script
        run: python .github/scripts/generate_docs.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DOCS_REPO_TOKEN: ${{ secrets.DOCS_REPO_TOKEN }}
          DOCS_REPO: ${{ secrets.DOCS_REPO }}        # e.g. your-org/product-docs
          GIT_AUTHOR_NAME: "docs-bot"
          GIT_AUTHOR_EMAIL: "docs-bot@users.noreply.github.com"
